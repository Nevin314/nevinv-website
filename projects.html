<!DOCTYPE html>
<html>
<head>

<link id="theme" rel="stylesheet" href="home.css">
</head>
<body>

<div class="projects-section"> 

    <h2> Here's some of my recent projects: </h2>
    <div id="projects" class="projects"> 

    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async() => {
        const username = "nevin314"; 
        const projectsContainer = document.getElementById("projects");

        try {
            const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated`);
            const repos = await response.json();

            // Filter out forks or specific repos if you want
            const filtered = repos.filter(repo => !repo.fork).slice(0, 4);

            projectsContainer.innerHTML = filtered.map(repo => {
            //const imgPath = `images/${repo.name}.png`;
            //<img src="${imgPath}" alt="${repo.name}" class="project-image" />
            return `
            <div class="project-card">
                <a href="${repo.html_url}" target="_blank" class="project-title">${repo.name}</a>
                <p class="project-desc">${repo.description ? repo.description : "No description available."}</p>
                <p class="project-meta">
                ⭐ ${repo.stargazers_count} | 🍴 ${repo.forks_count} | Updated ${new Date(repo.updated_at).toLocaleDateString()}
                </p>
            </div>
            `;
        }).join("");
        } catch (err) {
            projectsContainer.innerHTML = `<p>Failed to load projects 😔</p>`;
            console.error(err);
        }
    });
</script>
</body>
</html>
